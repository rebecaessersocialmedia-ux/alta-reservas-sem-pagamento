    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // opaque contexts — file:// — everything serializes as 'null', where

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

olor:#b8ae9f;\">As cinco etapas são servidas em sequência, para toda a mesa.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 6 · RESERVA -->\n<section id=\"reserva\" ref=\"{{ reservaRef }}\" data-screen-label=\"06 Reserva\" style=\"padding:clamp(88px,14vh,150px) clamp(18px,5vw,64px);background:rgba(0,0,0,.35);border-top:1px solid rgba(179,145,105,.18);scroll-margin-top:0;\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(40px,6vh,64px);\">\n\n    <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:18px;max-width:640px;\">\n        <p style=\"margin:0;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#b39169;\">Reserva<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(34px,4.6vw,60px);line-height:1.05;letter-spacing:.06em;text-transform:uppercase;color:#ede7dc;\">Reserve sua experiência<\u002Fh2>\n        <p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:clamp(19px,1.7vw,22px);line-height:1.55;color:#cfc6b8;\">Escolha sua data, informe o número de convidados e confirme pelo WhatsApp.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(40px,5vw,72px);align-items:flex-start;\">\n        <div style=\"flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:clamp(44px,6vh,60px);\">\n\n          <fieldset data-reveal=\"\" style=\"margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:20px;\">\n            <legend style=\"padding:0;margin-bottom:20px;display:flex;align-items:baseline;gap:16px;\">\n              <span style=\"font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.4em;color:#b39169;\">01<\u002Fspan>\n              <span style=\"font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.06em;color:#ede7dc;\">Escolha sua data<\u002Fspan>\n            <\u002Flegend>\n            <div role=\"group\" aria-label=\"Datas disponíveis\" style=\"display:grid;grid-template-columns:minmax(0,220px);gap:clamp(8px,1.4vw,14px);\">\n              <sc-for list=\"{{ dates }}\" as=\"d\" hint-placeholder-count=\"1\">\n                <button type=\"button\" data-tilt=\"\" sc-camel-on-click=\"{{ d.onClick }}\" aria-pressed=\"{{ d.selected }}\" aria-label=\"{{ d.aria }}\" style=\"position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:clamp(16px,2.4vw,24px) 4px;min-height:96px;cursor:pointer;background:{{ d.bg }};border:1px solid {{ d.border }};color:#ede7dc;transition:background .45s ease,border-color .45s ease;\" style-hover=\"border-color:#c9ae84;\">\n                  <span style=\"font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.3em;color:{{ d.weekColor }};padding-left:.3em;\">{{ d.week }}<\u002Fspan>\n                  <span style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(30px,4vw,40px);font-weight:300;line-height:1;color:{{ d.dayColor }};transition:color .45s ease;\">{{ d.day }}<\u002Fspan>\n                  <span style=\"font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.3em;color:#a99f92;padding-left:.3em;\">OUT<\u002Fspan>\n                  <span aria-hidden=\"true\" style=\"position:absolute;left:50%;bottom:-1px;width:{{ d.barW }};height:2px;background:#c9ae84;transform:translateX(-50%);transition:width .5s ease;\"><\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.12em;color:#a99f92;\">Chegada às 19:00 · Jantar guiado às 20:00<\u002Fp>\n          <\u002Ffieldset>\n\n          <fieldset data-reveal=\"\" style=\"margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:20px;\">\n            <legend style=\"padding:0;margin-bottom:20px;display:flex;align-items:baseline;gap:16px;\">\n              <span style=\"font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.4em;color:#b39169;\">02<\u002Fspan>\n              <span style=\"font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.06em;color:#ede7dc;\">Número de convidados<\u002Fspan>\n            <\u002Flegend>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid rgba(179,145,105,.32);border-bottom:1px solid rgba(179,145,105,.32);\">\n              <button type=\"button\" sc-camel-on-click=\"{{ dec }}\" disabled=\"{{ decDisabled }}\" aria-label=\"Diminuir convidados\" style=\"width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(179,145,105,.45);color:#d6c09a;font-family:'Cormorant Garamond',serif;font-size:28px;cursor:pointer;opacity:{{ decOpacity }};transition:border-color .3s ease,opacity .3s ease;\" style-hover=\"border-color:#d6c09a;\">−<\u002Fbutton>\n              <div aria-live=\"polite\" style=\"display:flex;flex-direction:column;align-items:center;gap:4px;\">\n                <span style=\"font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;line-height:1;color:#ede7dc;min-width:60px;text-align:center;overflow:hidden;\">{{ countEl }}<\u002Fspan>\n                <span style=\"font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:#a99f92;padding-left:.36em;\">{{ guestsWord }}<\u002Fspan>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ inc }}\" disabled=\"{{ incDisabled }}\" aria-label=\"Aumentar convidados\" style=\"width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(179,145,105,.45);color:#d6c09a;font-family:'Cormorant Garamond',serif;font-size:28px;cursor:pointer;opacity:{{ incOpacity }};transition:border-color .3s ease,opacity .3s ease;\" style-hover=\"border-color:#d6c09a;\">+<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Ffieldset>\n\n          <sc-if value=\"{{ noDate }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;padding:22px 0;border-top:1px solid rgba(179,145,105,.2);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:#a99f92;\">Selecione uma data para preencher os dados da reserva.<\u002Fp>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hasDate }}\" hint-placeholder-val=\"{{ true }}\">\n            <fieldset style=\"margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:26px;animation:altaFade .6s ease;\">\n              <legend style=\"padding:0;margin-bottom:20px;display:flex;align-items:baseline;gap:16px;\">\n                <span style=\"font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.4em;color:#b39169;\">03<\u002Fspan>\n                <span style=\"font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.06em;color:#ede7dc;\">Seus dados<\u002Fspan>\n              <\u002Flegend>\n              <label style=\"display:flex;flex-direction:column;gap:8px;\">\n                <span style=\"font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#b39169;\">Nome completo<\u002Fspan>\n                <input type=\"text\" name=\"name\" autocomplete=\"name\" value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" style=\"width:100%;padding:12px 0;background:transparent;border:0;border-bottom:1px solid rgba(179,145,105,.45);color:#ede7dc;font-family:'Jost',sans-serif;font-size:16px;outline:none;border-radius:0;\" style-focus=\"border-bottom-color:#d6c09a;\">\n                <span role=\"alert\" style=\"font-family:'Jost',sans-serif;font-size:12px;color:#d9826f;min-height:0;\">{{ errName }}<\u002Fspan>\n              <\u002Flabel>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:26px 32px;\">\n                <label style=\"display:flex;flex-direction:column;gap:8px;\">\n                  <span style=\"font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#b39169;\">WhatsApp<\u002Fspan>\n                  <input type=\"tel\" name=\"whatsapp\" inputmode=\"tel\" autocomplete=\"tel\" placeholder=\"(34) 99999-9999\" value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhone }}\" style=\"width:100%;padding:12px 0;background:transparent;border:0;border-bottom:1px solid rgba(179,145,105,.45);color:#ede7dc;font-family:'Jost',sans-serif;font-size:16px;outline:none;border-radius:0;\" style-focus=\"border-bottom-color:#d6c09a;\">\n                  <span role=\"alert\" style=\"font-family:'Jost',sans-serif;font-size:12px;color:#d9826f;\">{{ errPhone }}<\u002Fspan>\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:8px;\">\n                  <span style=\"font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#b39169;\">E-mail<\u002Fspan>\n                  <input type=\"email\" name=\"email\" inputmode=\"email\" autocomplete=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"width:100%;padding:12px 0;background:transparent;border:0;border-bottom:1px solid rgba(179,145,105,.45);color:#ede7dc;font-family:'Jost',sans-serif;font-size:16px;outline:none;border-radius:0;\" style-focus=\"border-bottom-color:#d6c09a;\">\n                  <span role=\"alert\" style=\"font-family:'Jost',sans-serif;font-size:12px;color:#d9826f;\">{{ errEmail }}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                <span style=\"font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#b39169;\">Quantidade de pessoas<\u002Fspan>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(179,145,105,.2);\">\n                  <span style=\"font-family:'Jost',sans-serif;font-size:16px;color:#ede7dc;\">{{ guestsLabel }}<\u002Fspan>\n                  <a href=\"#reserva\" style=\"font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#b39169;\">Alterar<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <label style=\"display:flex;flex-direction:column;gap:8px;\">\n                <span style=\"font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#b39169;\">Observações <span style=\"color:#7d7468;letter-spacing:.2em;\">· opcional<\u002Fspan><\u002Fspan>\n                <textarea name=\"notes\" rows=\"3\" placeholder=\"Alguma informação importante para nossa equipe?\" value=\"{{ notes }}\" sc-camel-on-change=\"{{ onNotes }}\" style=\"width:100%;padding:12px 0;background:transparent;border:0;border-bottom:1px solid rgba(179,145,105,.45);color:#ede7dc;font-family:'Jost',sans-serif;font-size:16px;line-height:1.5;outline:none;resize:vertical;border-radius:0;\" style-focus=\"border-bottom-color:#d6c09a;\"><\u002Ftextarea>\n              <\u002Flabel>\n\n              <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                <label style=\"display:flex;align-items:flex-start;gap:14px;cursor:pointer;min-height:44px;\">\n                  <input type=\"checkbox\" checked=\"{{ accepted }}\" sc-camel-on-change=\"{{ onAccept }}\" style=\"width:20px;height:20px;margin:2px 0 0;accent-color:#c9ae84;flex:none;\">\n                  <span style=\"font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.4;color:#cfc6b8;\">Li e estou de acordo com as condições da reserva.<\u002Fspan>\n                <\u002Flabel>\n                <span role=\"alert\" style=\"font-family:'Jost',sans-serif;font-size:12px;color:#d9826f;\">{{ errAccept }}<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ toggleTerms }}\" aria-expanded=\"{{ showTerms }}\" style=\"align-self:flex-start;display:flex;align-items:center;gap:10px;padding:8px 0;background:transparent;border:0;color:#b39169;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;\" style-hover=\"color:#d6c09a;\">{{ termsLabel }}<\u002Fbutton>\n                <sc-if value=\"{{ showTerms }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:20px;max-height:420px;overflow-y:auto;padding:22px 22px;border:1px solid rgba(179,145,105,.25);font-family:'Jost',sans-serif;font-size:13.5px;line-height:1.65;color:#cfc6b8;text-wrap:pretty;animation:altaFade .4s ease;\">\n                    <section style=\"display:flex;flex-direction:column;gap:10px;\"><h4 style=\"margin:0;font-family:'Jost',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:#d6c09a;\">Valores<\u002Fh4><p style=\"margin:0;\">Menu Experiência: R$ 248 por pessoa. Bebidas à parte.<\u002Fp><p style=\"margin:0;\">Não há cobrança antecipada: o pagamento é feito no restaurante, na noite da experiência.<\u002Fp><p style=\"margin:0;\">Chegada às 19:00. O jantar guiado começa às 20:00.<\u002Fp><\u002Fsection>\n                    <section style=\"display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:1px solid rgba(179,145,105,.2);\"><h4 style=\"margin:0;font-family:'Jost',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:#d6c09a;\">Restrições alimentares<\u002Fh4><p style=\"margin:0;\">O Menu Experiência do Alta Asian foi cuidadosamente elaborado para proporcionar uma experiência gastronômica completa e, por isso, <strong style=\"font-weight:500;color:#ede7dc;\">não realizamos substituições ou alterações nos itens do menu por preferência pessoal<\u002Fstrong>.<\u002Fp><p style=\"margin:0;\">Em casos de <strong style=\"font-weight:500;color:#ede7dc;\">restrições alimentares comprovadas<\u002Fstrong>, nossa equipe poderá avaliar previamente a possibilidade de adequação, conforme os ingredientes e a estrutura do menu.<\u002Fp><p style=\"margin:0;\">Para garantir o melhor atendimento, informe qualquer restrição alimentar <strong style=\"font-weight:500;color:#ede7dc;\">no momento da reserva<\u002Fstrong>, no campo de observações.<\u002Fp><\u002Fsection>\n                    <section style=\"display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:1px solid rgba(179,145,105,.2);\"><h4 style=\"margin:0;font-family:'Jost',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:#d6c09a;\">Cancelamento e remarcação<\u002Fh4><p style=\"margin:0;\">Como as vagas são limitadas e o menu é preparado para cada mesa, pedimos que qualquer cancelamento ou alteração seja avisado com antecedência pelo WhatsApp.<\u002Fp><p style=\"margin:0;\">Sempre que possível, a reserva poderá ser <strong style=\"font-weight:500;color:#ede7dc;\">remarcada<\u002Fstrong>, de acordo com a disponibilidade de datas do Alta Asian.<\u002Fp><p style=\"margin:0;\">Caso o Alta Asian precise cancelar a experiência, entraremos em contato para oferecer uma nova data.<\u002Fp><\u002Fsection>\n                    <section style=\"display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:1px solid rgba(179,145,105,.2);\"><h4 style=\"margin:0;font-family:'Jost',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:#d6c09a;\">Crianças<\u002Fh4><p style=\"margin:0;\">O Alta Asian é uma experiência gastronômica guiada, com duração e dinâmica pensadas especialmente para o público adulto. Por isso, recomendamos que a experiência seja aproveitada sem crianças.<\u002Fp><p style=\"margin:0;\">Ainda assim, crianças são bem-vindas e podem participar da experiência normalmente, desde que incluídas na reserva e com o pagamento do Menu Experiência.<\u002Fp><p style=\"margin:0;\"><strong style=\"font-weight:500;color:#ede7dc;\">Importante:<\u002Fstrong> para fins de reserva e organização do espaço, <strong style=\"font-weight:500;color:#ede7dc;\">cada criança é contabilizada como uma pessoa<\u002Fstrong>, independentemente da idade.<\u002Fp><\u002Fsection>\n                    \n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:14px;\">\n                <button data-magnetic=\"\" type=\"button\" sc-camel-on-click=\"{{ sendWhatsapp }}\" style=\"display:flex;align-items:center;justify-content:center;gap:14px;min-height:58px;padding:0 32px;background:linear-gradient(110deg,#c9ae84 0%,#c9ae84 38%,#f3e4c4 50%,#c9ae84 62%,#c9ae84 100%);background-size:280% 100%;background-position:100% 0;border:0;color:#0a0908;font-family:'Jost',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;transition:background-position 1.1s cubic-bezier(.16,1,.3,1),box-shadow .5s ease;\" style-hover=\"background-position:0% 0;box-shadow:0 10px 30px -12px rgba(201,174,132,.55);\">Confirmar reserva pelo WhatsApp<\u002Fbutton>\n                <p style=\"margin:0;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#a99f92;text-align:center;\">Sem cobrança antecipada · pagamento no restaurante<\u002Fp>\n              <\u002Fdiv>\n            <\u002Ffieldset>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <aside aria-label=\"Resumo de valores\" data-reveal=\"scale\" data-tilt=\"soft\" style=\"flex:1 1 340px;min-width:0;position:sticky;top:24px;display:flex;flex-direction:column;gap:0;padding:clamp(26px,3vw,40px);border:1px solid rgba(179,145,105,.38);background:rgba(10,9,8,.6);\">\n          <div style=\"display:flex;align-items:center;justify-content:space
